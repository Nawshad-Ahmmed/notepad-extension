<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notepad</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="panel">

<!-- ============ LOCK SCREEN ============ -->
<section id="screen-lock" class="screen">
  <div class="lock">
    <svg class="icon big" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <h2>Notes are locked</h2>
    <p class="hint">Enter your passphrase to decrypt them.</p>
    <form id="unlock-form">
      <input id="unlock-pass" type="password" placeholder="Passphrase" autocomplete="current-password">
      <div id="unlock-err" class="err"></div>
      <button id="btn-unlock" class="primary wide" type="submit">Unlock</button>
    </form>
  </div>
</section>

<!-- ============ LIST SCREEN ============ -->
<section id="screen-list" class="screen">
  <header>
    <span class="title">Notepad</span>
    <button id="btn-theme" title="Toggle theme">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="menu-wrap">
      <button id="btn-menu" title="More">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
      <div id="menu" class="menu">
        <button id="btn-encrypt">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span id="btn-encrypt-label">Encrypt notes…</span>
        </button>
        <button id="btn-lock" hidden>
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          Lock now
        </button>
        <button id="btn-passphrase" hidden>
          <svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3"/><path d="M11 12h10M17 12v3M20 12v2"/></svg>
          Change passphrase…
        </button>
        <button id="btn-decrypt" class="danger" hidden>
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-1.8"/></svg>
          Turn off encryption…
        </button>
        <div class="sep"></div>
        <button id="btn-export-all">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export all (.json)
        </button>
        <button id="btn-import">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          Import .json
        </button>
      </div>
    </div>
    <button id="btn-new" class="primary">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </header>

  <div class="search-wrap">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search notes…" autocomplete="off">
  </div>

  <div id="list"></div>
  <input id="file" type="file" accept="application/json,.json" hidden>
</section>

<!-- ============ EDITOR SCREEN ============ -->
<section id="screen-edit" class="screen">
  <header>
    <button id="btn-back" title="Back to all notes">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span class="title">Note</span>
    <button id="btn-preview" title="Preview markdown (Ctrl+E)">
      <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button id="btn-pin" title="Pin note">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 3v2H6v-2l4-3-1-6z"/><path d="M12 14v7"/></svg>
    </button>
    <button id="btn-copy" title="Copy note text">
      <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <button id="btn-download" title="Download as .txt">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
    <button id="btn-delete" class="danger" title="Delete note">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
    </button>
  </header>

  <input id="note-title" placeholder="Title" autocomplete="off">
  <textarea id="note-body" placeholder="Start typing…" spellcheck="true"></textarea>
  <div id="note-preview" class="md" hidden></div>

  <footer>
    <span id="stats"></span>
    <span class="spacer"></span>
    <span id="lockbadge" hidden title="Encrypted at rest">
      <svg class="icon sm" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </span>
    <span id="status" class="hide">Saved</span>
  </footer>
</section>

<!-- ============ PASSPHRASE DIALOG ============ -->
<dialog id="dlg">
  <form id="dlg-form" method="dialog">
    <h2 id="dlg-title">Encrypt your notes</h2>
    <p id="dlg-hint" class="hint"></p>
    <input id="dlg-old" type="password" placeholder="Current passphrase" autocomplete="current-password" hidden>
    <input id="dlg-p1" type="password" placeholder="Passphrase" autocomplete="new-password">
    <input id="dlg-p2" type="password" placeholder="Confirm passphrase" autocomplete="new-password">
    <div id="dlg-err" class="err"></div>
    <div class="dlg-row">
      <button type="button" id="dlg-cancel">Cancel</button>
      <button type="submit" id="dlg-ok" class="primary">Encrypt</button>
    </div>
  </form>
</dialog>

<script src="vault.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
